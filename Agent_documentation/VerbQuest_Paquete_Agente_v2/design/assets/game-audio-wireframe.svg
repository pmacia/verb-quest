<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 900" role="img" aria-labelledby="title desc">
<title id="title">VerbQuest Audio Detective wireframe</title><desc id="desc">Pantalla conceptual del juego auditivo con reproducción, respuesta y feedback.</desc>
<rect width="820" height="900" rx="28" fill="#F5F8FC"/><rect x="20" y="18" width="780" height="78" rx="18" fill="#102A56"/><text x="48" y="51" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#FFF">Audio Detective</text><text x="48" y="77" font-family="Arial,sans-serif" font-size="14" fill="#DCEBFF">Escucha, identifica y aprende</text><text x="760" y="58" font-family="Arial,sans-serif" font-size="17" fill="#FFC857" text-anchor="end">3 / 10</text>
<rect x="40" y="121" width="740" height="10" rx="5" fill="#D7E2EF"/><rect x="40" y="121" width="222" height="10" rx="5" fill="#20C7B2"/>
<text x="410" y="188" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#102A56" text-anchor="middle">¿Qué forma has escuchado?</text>
<rect x="130" y="220" width="560" height="250" rx="24" fill="#EAF4FF"/><circle cx="410" cy="318" r="65" fill="#1976F3"/><path d="M392 284 L392 352 L446 318 Z" fill="#FFF"/><text x="410" y="406" font-family="Arial,sans-serif" font-size="17" fill="#102A56" text-anchor="middle">Pulsa para escuchar otra vez</text><rect x="280" y="428" width="260" height="22" rx="11" fill="#D7E2EF"/><rect x="280" y="428" width="168" height="22" rx="11" fill="#20C7B2"/>
<g font-family="Arial,sans-serif" font-size="19" text-anchor="middle"><rect x="70" y="508" width="325" height="74" rx="16" fill="#FFF" stroke="#D7E2EF" stroke-width="2"/><text x="232" y="553" fill="#102A56">write</text><rect x="425" y="508" width="325" height="74" rx="16" fill="#DDF7F1" stroke="#20C7B2" stroke-width="3"/><text x="587" y="553" fill="#087C6B" font-weight="bold">wrote</text><rect x="70" y="600" width="325" height="74" rx="16" fill="#FFF" stroke="#D7E2EF" stroke-width="2"/><text x="232" y="645" fill="#102A56">written</text><rect x="425" y="600" width="325" height="74" rx="16" fill="#FFF" stroke="#D7E2EF" stroke-width="2"/><text x="587" y="645" fill="#102A56">writing</text></g>
<rect x="70" y="704" width="680" height="84" rx="16" fill="#FFF" stroke="#D7E2EF" stroke-width="2"/><circle cx="109" cy="746" r="20" fill="#20C7B2"/><path d="M99 746 L106 753 L120 738" fill="none" stroke="#FFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="145" y="739" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#087C6B">¡Bien hecho!</text><text x="145" y="762" font-family="Arial,sans-serif" font-size="15" fill="#5D6B82">Wrote es el pasado simple de write. Written es el participio.</text><rect x="520" y="812" width="230" height="58" rx="14" fill="#1976F3"/><text x="635" y="847" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#FFF" text-anchor="middle">Siguiente</text>
</svg>
