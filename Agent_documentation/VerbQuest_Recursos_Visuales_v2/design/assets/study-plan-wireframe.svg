<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">VerbQuest study plan wireframe</title><desc id="desc">Pantalla conceptual para elegir plantilla y configurar un plan de estudio diario.</desc>
<rect width="1100" height="760" rx="24" fill="#F5F8FC"/><rect x="22" y="20" width="1056" height="76" rx="16" fill="#102A56"/><text x="48" y="64" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#FFF">Tu plan de estudio</text><text x="1048" y="64" font-family="Arial,sans-serif" font-size="15" fill="#DCEBFF" text-anchor="end">Paso 1 de 3</text>
<rect x="22" y="116" width="1056" height="54" rx="13" fill="#DCEBFF"/><rect x="22" y="116" width="352" height="54" rx="13" fill="#1976F3"/><text x="198" y="149" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#FFF" text-anchor="middle">1. Elige el contenido</text><text x="550" y="149" font-family="Arial,sans-serif" font-size="16" fill="#102A56" text-anchor="middle">2. Objetivos</text><text x="902" y="149" font-family="Arial,sans-serif" font-size="16" fill="#102A56" text-anchor="middle">3. Rutina</text>
<text x="36" y="216" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#102A56">Selecciona una plantilla</text><text x="36" y="243" font-family="Arial,sans-serif" font-size="15" fill="#5D6B82">Puedes modificar la lista antes de empezar.</text>
<g font-family="Arial,sans-serif"><g transform="translate(36 270)"><rect width="325" height="150" rx="16" fill="#FFF" stroke="#1976F3" stroke-width="3"/><circle cx="40" cy="40" r="22" fill="#DDF7F1"/><text x="40" y="47" font-size="24" text-anchor="middle" fill="#087C6B">✓</text><text x="76" y="38" font-size="19" font-weight="bold" fill="#102A56">Empiezo desde cero</text><text x="76" y="64" font-size="14" fill="#5D6B82">Esenciales y muy frecuentes</text><text x="22" y="100" font-size="15" fill="#15243B">Aproximadamente 100 verbos</text><text x="22" y="126" font-size="13" fill="#1976F3">Plantilla editable</text></g>
<g transform="translate(388 270)"><rect width="325" height="150" rx="16" fill="#FFF" stroke="#D7E2EF" stroke-width="2"/><circle cx="40" cy="40" r="22" fill="#FFF0C8"/><text x="40" y="47" font-size="24" text-anchor="middle" fill="#9A6B00">2</text><text x="76" y="38" font-size="19" font-weight="bold" fill="#102A56">Por curso</text><text x="76" y="64" font-size="14" fill="#5D6B82">1.º, 2.º, 3.º o 4.º de ESO</text><text x="22" y="100" font-size="15" fill="#15243B">Nivel recomendado configurable</text><text x="22" y="126" font-size="13" fill="#5D6B82">No es una asignación universal</text></g>
<g transform="translate(740 270)"><rect width="325" height="150" rx="16" fill="#FFF" stroke="#D7E2EF" stroke-width="2"/><circle cx="40" cy="40" r="22" fill="#E6E2FF"/><text x="40" y="47" font-size="24" text-anchor="middle" fill="#6555D7">≋</text><text x="76" y="38" font-size="19" font-weight="bold" fill="#102A56">Mi lista / examen</text><text x="76" y="64" font-size="14" fill="#5D6B82">Importa o selecciona verbos</text><text x="22" y="100" font-size="15" fill="#15243B">Lista del profesor o personal</text><text x="22" y="126" font-size="13" fill="#5D6B82">CSV / JSON / selección manual</text></g></g>
<rect x="22" y="447" width="1056" height="228" rx="16" fill="#FFF" stroke="#D7E2EF" stroke-width="2"/><text x="48" y="484" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#102A56">Resumen del plan</text><text x="48" y="521" font-family="Arial,sans-serif" font-size="15" fill="#5D6B82">Objetivo de sesión</text><g font-family="Arial,sans-serif" font-size="15"><rect x="48" y="536" width="140" height="38" rx="10" fill="#1976F3"/><text x="118" y="560" fill="#FFF" font-weight="bold" text-anchor="middle">5 min</text><rect x="198" y="536" width="140" height="38" rx="10" fill="#DCEBFF"/><text x="268" y="560" fill="#102A56" text-anchor="middle">10 min</text><rect x="348" y="536" width="140" height="38" rx="10" fill="#DCEBFF"/><text x="418" y="560" fill="#102A56" text-anchor="middle">15 min</text><text x="48" y="618" fill="#5D6B82">Verbos nuevos por sesión</text><rect x="48" y="631" width="440" height="10" rx="5" fill="#D7E2EF"/><rect x="48" y="631" width="176" height="10" rx="5" fill="#20C7B2"/><circle cx="224" cy="636" r="10" fill="#20C7B2" stroke="#FFF" stroke-width="3"/><text x="514" y="521" fill="#5D6B82">El plan mezcla</text><text x="514" y="551" fill="#15243B">✓ repasos vencidos</text><text x="514" y="579" fill="#15243B">✓ contenido nuevo</text><text x="514" y="607" fill="#15243B">✓ escucha y contexto</text><text x="514" y="635" fill="#5D6B82">Se adapta si hay errores recientes.</text><rect x="814" y="585" width="236" height="58" rx="14" fill="#1976F3"/><text x="932" y="620" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#FFF" text-anchor="middle">Crear plan</text></g>
</svg>
